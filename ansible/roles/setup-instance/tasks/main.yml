---
- name: Upgrade all packages
  dnf:
    name: "*"
    state: latest
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: '"fedora" in xserver_distro'

- name: Upgrade all packages
  apt:
    name: "*"
    state: latest
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: '"debian" in xserver_distro'

- name: Install packages
  dnf:
    name: "{{ packages }}"
    state: latest
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  vars:
    packages:
      - podman
  when: '"fedora" in xserver_distro'

- name: Install packages
  apt:
    name: "{{ packages }}"
    state: latest
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  vars:
    packages:
      - podman
  when: '"debian" in xserver_distro'

- name: Enable podman-restart service
  systemd:
    name: podman-restart
    enabled: true
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: '"pios11" not in xserver_os'

- name: Enable podman-restart service for current user
  systemd:
    name: podman-restart
    enabled: true
    scope: user
  become: false
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: '"pios11" not in xserver_os'

- name: Enable lingering for rootless containers
  command: loginctl enable-linger {{ ansible_user }}
  become: false
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Load required modules
  template:
    src: x-server-modules.conf.j2
    dest: /etc/modules-load.d/x-server-modules.conf
    owner: root
    group: root
    mode: 0644
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Update sysctl
  template:
    src: podman-net.conf.j2
    dest: /etc/sysctl.d/podman-net.conf
    owner: root
    group: root
    mode: 0644
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Create a new group(xuser) for container
  group:
    name: "{{ xserver_container_non_root_group }}"
    gid: "{{ xserver_container_non_root_id }}"
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Create a new user(xuser) for container
  user:
    name: "{{ xserver_container_non_root_user }}"
    comment: For xserver container non-root user
    uid: "{{ xserver_container_non_root_id }}"
    group: "{{ xserver_container_non_root_group }}"
    create_home: false
    password: '!'
    password_lock: true
    shell: /usr/sbin/nologin/
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Create podman network directory
  file:
    path: /etc/containers/networks
    state: directory
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: 'podman_custom_network|bool and xs_root_container|bool'

- name: Create podman network directory - rootless
  file:
    path: ~/.local/share/containers/storage/networks
    state: directory
  become: false
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: 'podman_custom_network|bool and xs_rootless_container|bool'

- name: Create podman dual stack network configuration
  template:
    src: podman-dual-stack.json.j2
    dest: /etc/containers/networks/podman-dual-stack.json
    owner: root
    group: root
    mode: 0644
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: 'podman_custom_network|bool and xs_root_container|bool'

- name: Create podman dual stack network configuration - rootless
  template:
    src: podman-dual-stack.json.j2
    dest: ~/.local/share/containers/storage/networks/podman-dual-stack.json
    mode: 0644
  become: false
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"
  when: 'podman_custom_network|bool and xs_rootless_container|bool'

- name: Create host deps file
  file:
    path: ~/.xs_host_done
    state: "touch"
  register: task_status
  until: task_status is successful
  retries: "{{ task_retries | int }}"
  delay: "{{ task_delay | int }}"

- name: Reboot server
  reboot:
    post_reboot_delay: 60
    reboot_timeout: 300
