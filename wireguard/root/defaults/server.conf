[Interface]
Address = ${SERVER_IP}
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
PostUp = DEF_INTERFACE=$(ip route show default | head -n 1 | awk '{print $5}'); iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;
PostUp_IPv6 = DEF_INTERFACE=$(ip -6 route show default | head -n 1 | awk '{print $5}'); ip6tables -A FORWARD -i %i -j ACCEPT; ip6tables -A FORWARD -o %i -j ACCEPT; ip6tables -t nat -A POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;
PostDown = DEF_INTERFACE=$(ip route show default | head -n 1 | awk '{print $5}'); iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;
PostDown_IPv6 = DEF_INTERFACE=$(ip -6 route show default | head -n 1 | awk '{print $5}'); ip6tables -D FORWARD -i %i -j ACCEPT; ip6tables -D FORWARD -o %i -j ACCEPT; ip6tables -t nat -D POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;