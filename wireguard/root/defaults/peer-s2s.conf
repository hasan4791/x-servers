PostUp = DROUTE=$(ip route | grep default | awk '{print $3}'); HOMENET=__HOMENET__; ip route add $HOMENET via $DROUTE;
PostUp = DEF_INTERFACE=$(ip route show default | head -n 1 | awk '{print $5}'); iptables -t nat -A POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;
PostDown = DROUTE=$(ip route | grep default | awk '{print $3}'); HOMENET=__HOMENET__; ip route del $HOMENET via $DROUTE;
PostDown = DEF_INTERFACE=$(ip route show default | head -n 1 | awk '{print $5}'); iptables -t nat -D POSTROUTING -o $DEF_INTERFACE -j MASQUERADE;